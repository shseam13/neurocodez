user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logs to stdout so Render collects them; there is no persistent disk.
    access_log /dev/stdout combined;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    client_max_body_size 25M;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml font/woff2;

    server {
        # Render routes to $PORT; 8080 matches the Dockerfile EXPOSE.
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php;

        charset utf-8;

        # Hashed asset filenames change on every build, so they are safe to cache
        # hard and forever.
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location ~* \.(woff2|woff|ttf|otf|svg|png|jpg|jpeg|webp|ico)$ {
            expires 30d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Nothing outside public/ is reachable, but be explicit about dotfiles.
        location ~ /\.(?!well-known).* {
            deny all;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            # PDF generation on a cold container can be slow.
            fastcgi_read_timeout 60;
            include fastcgi_params;
        }
    }
}
