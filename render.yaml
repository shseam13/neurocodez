# Render blueprint.
#
# The database is deliberately NOT defined here. Render's own Postgres is not an
# option — this app targets MySQL so it can move to cPanel later without a
# rewrite — and their free MySQL does not exist. Use Aiven's always-free MySQL
# and paste the credentials in as environment variables. See DEPLOYMENT.md.

services:
  - type: web
    name: neuro-codez
    runtime: docker
    plan: free
    region: singapore # closest Render region to Bangladesh
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up

    envVars:
      # nginx listens on 8080 (docker/nginx.conf). Render's port auto-detection
      # usually finds it, but stating it removes the guesswork — a mismatch here
      # shows up as a health check that never passes, with a healthy container.
      - key: PORT
        value: 8080

      - key: APP_NAME
        value: Neuro Codez
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      # Generate with: php artisan key:generate --show
      # Set once, then never change it — rotating the key makes every existing
      # session and encrypted value unreadable.
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false

      - key: LOG_CHANNEL
        value: stderr # no persistent disk, so logs must go to the console
      - key: LOG_LEVEL
        value: warning

      # --- database (Aiven free MySQL) -------------------------------------
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Aiven requires TLS. Paste the whole CA certificate — including the
      # BEGIN/END lines — from the Aiven console into DB_SSL_CA_CERT; the
      # entrypoint writes it to the path below on boot. It is a public
      # certificate, not a secret, but it stays out of the repo so the image
      # works against any database.
      - key: DB_SSL_CA_CERT
        sync: false
      - key: MYSQL_ATTR_SSL_CA
        value: /var/www/html/storage/certs/aiven-ca.pem

      # --- session, cache, queue -------------------------------------------
      # All on the database. The filesystem here is EPHEMERAL: file sessions
      # would log everyone out on every deploy, and file cache would vanish.
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: SESSION_SECURE_COOKIE
        value: true

      # --- uploads (Cloudflare R2) -----------------------------------------
      # Project files and images MUST NOT live on the container disk — a redeploy
      # would destroy every client deliverable.
      - key: FILESYSTEM_DISK
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_BUCKET
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: true

      # --- mail -------------------------------------------------------------
      # Invitations and password resets are useless without a real sender.
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SCHEME
        value: tls
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: Neuro Codez

      # --- app settings -----------------------------------------------------
      # Public contact details. Not secrets — they are printed on the website
      # and on every invoice — so they are set here rather than typed into the
      # dashboard one field at a time.
      - key: NEURO_YOUTUBE_CHANNEL
        value: "@neuro-codez"
      - key: NEURO_PUBLIC_EMAIL
        value: neurocodez.tech@gmail.com
      - key: NEURO_PUBLIC_PHONE
        value: "+8801626-014236"
      - key: NEURO_WHATSAPP
        value: "+8801626014236"
      - key: NEURO_SOCIAL_YOUTUBE
        value: https://www.youtube.com/@neuro-codez
      - key: NEURO_SOCIAL_FACEBOOK
        value: https://www.facebook.com/profile.php?id=61564889531223
      - key: NEURO_SOCIAL_INSTAGRAM
        value: https://instagram.com/neuro_codez

      - key: NEURO_CURRENCY
        value: BDT
      - key: NEURO_INVOICE_DUE_DAYS
        value: 14
      # Keep false until Noto Sans Bengali is registered with dompdf — the
      # bundled DejaVu fonts have no Bengali script, so a ৳ renders as an empty
      # box on the invoice. Amounts print as "BDT 50,000.00" instead.
      - key: NEURO_TAKA_GLYPH
        value: false
