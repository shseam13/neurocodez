# Render blueprint.
#
# The database is deliberately NOT defined here. Render's own Postgres is not an
# option — this app targets MySQL so it can move to cPanel later without a
# rewrite — and their free MySQL does not exist. Use Aiven's always-free MySQL
# and paste the credentials in as environment variables. See DEPLOYMENT.md.

services:
  - type: web
    name: neuro-codez
    runtime: docker
    plan: free
    region: singapore # closest Render region to Bangladesh
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up

    envVars:
      - key: APP_NAME
        value: Neuro Codez
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      # Generate with: php artisan key:generate --show
      # Set once, then never change it — rotating the key makes every existing
      # session and encrypted value unreadable.
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false

      - key: LOG_CHANNEL
        value: stderr # no persistent disk, so logs must go to the console
      - key: LOG_LEVEL
        value: warning

      # --- database (Aiven free MySQL) -------------------------------------
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Aiven requires TLS.
      - key: MYSQL_ATTR_SSL_CA
        value: /var/www/html/storage/certs/aiven-ca.pem

      # --- session, cache, queue -------------------------------------------
      # All on the database. The filesystem here is EPHEMERAL: file sessions
      # would log everyone out on every deploy, and file cache would vanish.
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: SESSION_SECURE_COOKIE
        value: true

      # --- uploads (Cloudflare R2) -----------------------------------------
      # Project files and images MUST NOT live on the container disk — a redeploy
      # would destroy every client deliverable.
      - key: FILESYSTEM_DISK
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_BUCKET
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: true

      # --- mail -------------------------------------------------------------
      # Invitations and password resets are useless without a real sender.
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SCHEME
        value: tls
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: Neuro Codez

      # --- app settings -----------------------------------------------------
      - key: NEURO_YOUTUBE_CHANNEL
        value: "@neuro-codez"
      - key: NEURO_PUBLIC_EMAIL
        sync: false
      - key: NEURO_PUBLIC_PHONE
        sync: false
      - key: NEURO_WHATSAPP
        sync: false
      - key: NEURO_SOCIAL_YOUTUBE
        value: https://www.youtube.com/@neuro-codez
      - key: NEURO_SOCIAL_FACEBOOK
        sync: false
      - key: NEURO_SOCIAL_INSTAGRAM
        sync: false
